app = "bananani"
primary_region = "cdg"

[build]
dockerfile = "Dockerfile"

[env]
DATA_DIR = "/data"
PORT = "8080"
HOST = "0.0.0.0"
# adapter-node limite le corps des requêtes à 512 Ko par défaut : trop juste pour
# l'upload de photos de recettes (plusieurs Mo). On relève à 16 Mo.
BODY_SIZE_LIMIT = "16M"
# Faire confiance aux headers du load balancer Fly (HTTPS termination chez eux).
# Nécessaire pour le check CSRF de SvelteKit et le flag Secure des cookies.
PROTOCOL_HEADER = "x-forwarded-proto"
HOST_HEADER = "x-forwarded-host"

[[mounts]]
source = "bananani_data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 256
