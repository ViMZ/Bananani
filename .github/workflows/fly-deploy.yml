name: Fly Deploy

# Déploie l'app sur Fly.io à chaque push sur main.
# Requiert le secret de dépôt FLY_API_TOKEN (généré via `fly tokens create deploy`).
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group # une seule release à la fois
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --strategy immediate : pas d'attente de health-check (la machine s'auto-éteint
      # avec scale-to-zero, sinon flyctl reste bloqué à la surveiller).
      # --wait-timeout : filet de sécurité pour ne jamais bloquer la file de runs.
      - run: flyctl deploy --remote-only --strategy immediate --wait-timeout 5m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
