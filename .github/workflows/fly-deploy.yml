name: Fly Deploy

# Déploie l'app sur Fly.io à chaque push sur main.
# Requiert le secret de dépôt FLY_API_TOKEN (généré via `fly tokens create deploy`).
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  scan-secrets:
    name: Scan des secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location -o "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Vérifier l’arbre et les commits entrants
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gitleaks dir --config .gitleaks.toml --redact=100 --no-banner --no-color --verbose --ignore-gitleaks-allow .
          range="$HEAD_SHA"
          if [[ "$BASE_SHA" =~ [1-9a-f] ]]; then
            range="$BASE_SHA..$HEAD_SHA"
          fi
          sh .githooks/scan-secrets --log-opts="$range" .

  deploy:
    name: Deploy app
    if: github.event_name == 'push'
    needs: scan-secrets
    runs-on: ubuntu-latest
    concurrency: deploy-group # une seule release à la fois
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --strategy immediate : pas d'attente de health-check (la machine s'auto-éteint
      # avec scale-to-zero, sinon flyctl reste bloqué à la surveiller).
      # --wait-timeout : filet de sécurité pour ne jamais bloquer la file de runs.
      - run: flyctl deploy --remote-only --strategy immediate --wait-timeout 5m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
