name: Fly Deploy

# Déploie l'app sur Fly.io à chaque push sur main.
# Requiert le secret de dépôt FLY_API_TOKEN (généré via `fly tokens create deploy`).
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group # une seule release à la fois
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
